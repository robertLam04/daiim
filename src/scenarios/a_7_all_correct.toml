# Scenario A: all providers use ground-truth coefficients with varied noise.
name = "a_7_all_correct"
seed = 100
rounds = 100

[task]
kind = "linear_regression"
description = "Reputation feedback experiment"
min_providers = 4
max_providers = 7

[task.ground_truth]
slope = 2.0
intercept = 3.0

[protocol]
reputation_adjustment_factor = 0.2

[[providers]]
id = 1
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 0.5 }

[[providers]]
id = 2
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 1.0 }

[[providers]]
id = 3
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 1.5 }

[[providers]]
id = 4
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 0.5 }

[[providers]]
id = 5
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 1.0 }

[[providers]]
id = 6
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 1.5 }

[[providers]]
id = 7
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 0.5 }
