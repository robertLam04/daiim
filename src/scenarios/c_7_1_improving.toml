# Provider 7 fixes its initially biased model starting in round 60.
name = "c_7_1_improving"
seed = 100
rounds = 100

[task]
kind = "linear_regression"
description = "Provider model improvement experiment"
min_providers = 4
max_providers = 7

[task.ground_truth]
slope = 2.0
intercept = 3.0

[protocol]
reputation_adjustment_factor = 0.2

[[providers]]
id = 1
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 0.5 }

[[providers]]
id = 2
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 1.0 }

[[providers]]
id = 3
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 1.5 }

[[providers]]
id = 4
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 0.5 }

[[providers]]
id = 5
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 1.0 }

[[providers]]
id = 6
agent = { type = "fixed", slope = 2.0, intercept = 3.0, noise = 1.5 }

[[providers]]
id = 7
agent = { type = "improving", slope = 2.1, intercept = 4.0, improved_slope = 2.0, improved_intercept = 3.0, improve_at_round = 60, noise = 0.5 }
